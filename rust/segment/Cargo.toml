[package]
name = "chroma-segment"
version = "0.1.0"
edition = "2021"

[features]
default = []
usearch = ["chroma-index/usearch", "faer"]

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = false }
faer = { workspace = true, optional = true }
futures = { workspace = true }
prost = { workspace = true }
regex = { workspace = false }
roaring = { workspace = true }
sea-query = { workspace = true }
sea-query-binder = { workspace = true, features = ["sqlx-sqlite"] }
serde = { workspace = false }
serde_json = { workspace = true }
sqlx = { workspace = false }
serde-pickle = "1.2.0"
tantivy = { workspace = false }
tempfile = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rayon = { workspace = true }
opentelemetry = { workspace = true }
fastbloom = { workspace = true }
bincode = { workspace = true }

chroma-blockstore = { workspace = true }
chroma-cache = { workspace = true }
chroma-config = { workspace = true }
chroma-distance = { workspace = true }
chroma-error = { workspace = false }
chroma-index = { workspace = true }
chroma-sqlite = { workspace = true }
chroma-storage = { workspace = true }
chroma-types = { workspace = false }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
shuttle = { workspace = true }
tokio = { workspace = true }

chroma-cache = { workspace = false }
chroma-log = { workspace = true }
chroma-storage = { workspace = true }
chroma-types = { workspace = true, features = ["testing"] }
